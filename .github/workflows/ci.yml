name: PatchBond exact-head security gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patchbond-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GENVM_VERSION: v0.2.16
      PYTHONUTF8: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4

      - name: Prove exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pure deterministic tests
        run: python -m pytest -q tests/test_core.py

      - name: Cache verified GenVM runner bundle for Direct
        shell: bash
        run: |
          GLTEST_CACHE_DIR="$(python -c 'from pathlib import Path; print(Path.home() / ".cache" / "gltest-direct")')"
          mkdir -p "$GLTEST_CACHE_DIR"
          curl --fail --location --retry 3 \
            https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
            --output "$GLTEST_CACHE_DIR/genvm-universal-v0.3.0-rc7.tar.xz"
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $GLTEST_CACHE_DIR/genvm-universal-v0.3.0-rc7.tar.xz" \
            | sha256sum --check --strict

      - name: Direct contract tests
        run: python -m pytest -q tests/test_direct_contract.py

      - name: Challenge and settlement mutation gate
        run: python tools/mutation_test.py

      - name: Five-validator GLSim proof
        run: python -m pytest -q tests/test_glsim_consensus.py

      - name: GenVM lint
        run: genvm-lint check contracts/patchbond.py
        env:
          GENVM_VERSION: v0.3.0-rc7

      - name: GenVM validation
        run: genvm-lint validate contracts/patchbond.py
        env:
          GENVM_VERSION: v0.3.0-rc7

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Contract source provenance
        run: python tools/source_hash.py

      - name: Secret scan
        run: python tools/secret_scan.py

      - name: Diff hygiene and generated-state check
        shell: bash
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
