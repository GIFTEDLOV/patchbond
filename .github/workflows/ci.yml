name: PatchBond exact-head security gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: patchbond-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GENVM_VERSION: v0.2.16
      PYTHONUTF8: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4

      - name: Prove exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Pure deterministic tests
        run: python -m pytest -q tests/test_core.py

      - name: Direct contract tests
        run: python -m pytest -q tests/test_direct_contract.py

      - name: Challenge and settlement mutation gate
        run: python tools/mutation_test.py

      - name: Five-validator GLSim proof
        run: python -m pytest -q tests/test_glsim_consensus.py

      - name: GenVM lint
        run: genvm-lint check contracts/patchbond.py
        env:
          GENVM_VERSION: v0.3.0-rc7

      - name: GenVM validation
        run: genvm-lint validate contracts/patchbond.py
        env:
          GENVM_VERSION: v0.3.0-rc7

      - name: Contract source provenance
        run: python tools/source_hash.py

      - name: Secret scan
        run: python tools/secret_scan.py

      - name: Diff hygiene and generated-state check
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
